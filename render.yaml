services:
  - type: web
    name: quesless-campus
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CAMPUS_NAME
        value: "Malla Reddy Engineering College for Women"
      - key: CANTEEN_TIMEZONE
        value: "Asia/Kolkata"
      - key: CANTEEN_OPEN_TIME
        value: "09:00"
      - key: CANTEEN_CLOSE_TIME
        value: "16:00"
      - key: PAYMENT_PROVIDER
        value: sandbox
      - key: CORS_ORIGIN
        value: "*"
      # Set active Supabase credentials in Render Dashboard -> Environment Variables:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
