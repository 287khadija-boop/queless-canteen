<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | Quesless Campus — MRECW</title>
  
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body>

  <!-- Top Header Navigation -->
  <header class="site-header">
    <div class="container header-inner">
      <a href="/" class="brand-wrapper">
        <div class="brand-logo-badge">QC</div>
        <div class="brand-info">
          <span class="brand-name">Quesless Campus</span>
          <span class="brand-subtext">Malla Reddy Engineering College for Women</span>
        </div>
      </a>
      <div class="nav-actions">
        <a href="/login.html" class="btn btn-secondary btn-sm">Back to Sign In</a>
      </div>
    </div>
  </header>

  <main class="main-content auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <h1>Reset Password</h1>
        <p>Enter your registered college email and we will send password recovery instructions.</p>
      </div>

      <form id="forgot-form">
        <div class="form-group">
          <label for="email" class="form-label">Registered Email Address</label>
          <input type="email" id="email" class="form-input" placeholder="student@mrecw.ac.in" required autocomplete="email">
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top: var(--spacing-6);">
          Send Reset Link
        </button>
      </form>

      <div class="auth-footer">
        Remembered your password? <a href="/login.html" class="font-semibold">Sign In</a>
      </div>
    </div>
  </main>

  <div id="toast-container"></div>

  <script src="/js/config.js"></script>
  <script type="module" src="/js/common.js"></script>
  <script type="module" src="/js/auth.js"></script>
  <script type="module">
    import { showToast } from '/js/common.js';
    import { sendPasswordResetEmail } from '/js/auth.js';

    const form = document.getElementById('forgot-form');
    const submitBtn = form.querySelector('button[type="submit"]');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();

      submitBtn.disabled = true;
      submitBtn.textContent = 'Sending...';

      try {
        await sendPasswordResetEmail(email);
        showToast('Password reset link sent! Check your email inbox.', 'success', 5000);
        submitBtn.textContent = 'Link Sent';
      } catch (err) {
        showToast(err.message || 'Failed to send reset link', 'error');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Send Reset Link';
      }
    });
  </script>
</body>
</html>
