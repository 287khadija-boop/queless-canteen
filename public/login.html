<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | Quesless Campus — MRECW</title>
  
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body>

  <!-- Top Header Navigation -->
  <header class="site-header">
    <div class="container header-inner">
      <a href="/" class="brand-wrapper">
        <div class="brand-logo-badge">QC</div>
        <div class="brand-info">
          <span class="brand-name">Quesless Campus</span>
          <span class="brand-subtext">Malla Reddy Engineering College for Women</span>
        </div>
      </a>
      <div class="nav-actions">
        <a href="/register.html" class="btn btn-outline btn-sm">Create Account</a>
      </div>
    </div>
  </header>

  <main class="main-content auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <h1>Welcome Back</h1>
        <p>Sign in to access your pre-orders, digital tokens, and kitchen queue.</p>
      </div>

      <!-- Portal Switcher Indicator -->
      <div class="role-pills" id="role-selector" role="tablist">
        <button type="button" class="role-pill active" data-portal="student" role="tab">Student</button>
        <button type="button" class="role-pill" data-portal="staff" role="tab">Staff Kitchen</button>
        <button type="button" class="role-pill" data-portal="shop_owner" role="tab">Shop Owner</button>
        <button type="button" class="role-pill" data-portal="accountant" role="tab">Accountant</button>
        <button type="button" class="role-pill" data-portal="admin" role="tab">Admin</button>
      </div>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="email" class="form-label">College Email Address</label>
          <input type="email" id="email" class="form-input" placeholder="student@mrecw.ac.in" required autocomplete="email">
          <div id="email-error" class="form-error" style="display: none;"></div>
        </div>

        <div class="form-group">
          <div class="flex items-center justify-between" style="margin-bottom: var(--spacing-2);">
            <label for="password" class="form-label" style="margin-bottom: 0;">Password</label>
            <a href="/forgot-password.html" style="font-size: var(--font-size-xs);">Forgot password?</a>
          </div>
          <input type="password" id="password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
          <div id="password-error" class="form-error" style="display: none;"></div>
        </div>

        <button type="submit" id="submit-btn" class="btn btn-primary btn-block btn-lg" style="margin-top: var(--spacing-6);">
          Sign In
        </button>

        <!-- Resend verification link container if unconfirmed -->
        <div id="resend-verification-container" style="display: none; margin-top: var(--spacing-4); text-align: center; font-size: var(--font-size-xs); background: #fef3c7; border: 1px solid #fde68a; padding: var(--spacing-3); border-radius: var(--radius-md);">
          <span>Didn't receive verification email? </span>
          <button type="button" id="resend-verification-btn" style="background: none; border: none; color: var(--color-primary-dark); font-weight: var(--font-weight-bold); cursor: pointer; text-decoration: underline;">
            Resend confirmation link
          </button>
        </div>

        <!-- Quick Demo Fillers for Immediate Evaluation -->
        <div style="margin-top: var(--spacing-5); padding: var(--spacing-3); background-color: var(--color-surface-muted); border-radius: var(--radius-lg); border: 1px solid var(--color-border);">
          <div class="flex items-center justify-between" style="margin-bottom: var(--spacing-2);">
            <span style="font-size: 11px; font-weight: var(--font-weight-bold); color: var(--color-text-muted); text-transform: uppercase;">1-Click Demo Logins:</span>
            <span class="badge badge-success" style="font-size: 10px; padding: 2px 6px;">Instant Access</span>
          </div>
          <div class="flex" style="gap: 6px; flex-wrap: wrap;">
            <button type="button" class="btn btn-secondary btn-sm" style="flex: 1; font-size: 11px; padding: 4px 6px;" id="demo-student-btn">Student</button>
            <button type="button" class="btn btn-secondary btn-sm" style="flex: 1; font-size: 11px; padding: 4px 6px;" id="demo-staff-btn">Staff</button>
            <button type="button" class="btn btn-secondary btn-sm" style="flex: 1; font-size: 11px; padding: 4px 6px;" id="demo-owner-btn">Shop Owner</button>
            <button type="button" class="btn btn-secondary btn-sm" style="flex: 1; font-size: 11px; padding: 4px 6px;" id="demo-accountant-btn">Accountant</button>
            <button type="button" class="btn btn-secondary btn-sm" style="flex: 1; font-size: 11px; padding: 4px 6px;" id="demo-admin-btn">Admin</button>
          </div>
        </div>
      </form>

      <div class="auth-footer">
        Don't have an account yet? <a href="/register.html" class="font-semibold">Register Here</a>
      </div>
    </div>
  </main>

  <div id="toast-container"></div>

  <script src="/js/config.js"></script>
  <script type="module" src="/js/common.js"></script>
  <script type="module" src="/js/auth.js"></script>
  <script type="module">
    import { showToast } from '/js/common.js';
    import { signInUser, resendVerificationLink } from '/js/auth.js';

    // Handle query parameter for pre-selecting portal (e.g. ?role=staff)
    const urlParams = new URLSearchParams(window.location.search);
    const targetRole = urlParams.get('role');
    const redirectTarget = urlParams.get('redirect');
    const pills = document.querySelectorAll('.role-pill');
    
    function setPortal(portalName) {
      pills.forEach(p => {
        if (p.dataset.portal === portalName) {
          p.classList.add('active');
        } else {
          p.classList.remove('active');
        }
      });
    }

    if (targetRole) {
      setPortal(targetRole);
    }

    pills.forEach(pill => {
      pill.addEventListener('click', () => {
        setPortal(pill.dataset.portal);
      });
    });

    // 1-Click Demo Fillers
    document.getElementById('demo-student-btn').addEventListener('click', () => {
      document.getElementById('email').value = 'student@mrecw.ac.in';
      document.getElementById('password').value = 'Student123!';
      setPortal('student');
      showToast('Loaded Demo Student credentials', 'info', 1500);
    });

    document.getElementById('demo-staff-btn').addEventListener('click', () => {
      document.getElementById('email').value = 'staff@mrecw.ac.in';
      document.getElementById('password').value = 'Staff123!';
      setPortal('staff');
      showToast('Loaded Demo Kitchen Staff credentials', 'info', 1500);
    });

    document.getElementById('demo-owner-btn').addEventListener('click', () => {
      document.getElementById('email').value = 'owner@mrecw.ac.in';
      document.getElementById('password').value = 'Owner123!';
      setPortal('shop_owner');
      showToast('Loaded Demo Shop Owner credentials', 'info', 1500);
    });

    document.getElementById('demo-accountant-btn').addEventListener('click', () => {
      document.getElementById('email').value = 'accountant@mrecw.ac.in';
      document.getElementById('password').value = 'Accountant123!';
      setPortal('accountant');
      showToast('Loaded Demo Accountant credentials', 'info', 1500);
    });

    document.getElementById('demo-admin-btn').addEventListener('click', () => {
      document.getElementById('email').value = 'admin@mrecw.ac.in';
      document.getElementById('password').value = 'Admin123!';
      setPortal('admin');
      showToast('Loaded Demo Admin credentials', 'info', 1500);
    });

    const form = document.getElementById('login-form');
    const submitBtn = document.getElementById('submit-btn');
    const resendContainer = document.getElementById('resend-verification-container');
    const resendBtn = document.getElementById('resend-verification-btn');

    resendBtn.addEventListener('click', async () => {
      const email = document.getElementById('email').value.trim();
      if (!email) {
        showToast('Please enter your email address first', 'warning');
        return;
      }
      resendBtn.disabled = true;
      resendBtn.textContent = 'Sending...';
      try {
        await resendVerificationLink(email);
        showToast('Verification link sent! Please check your inbox.', 'success', 5000);
        resendBtn.textContent = 'Sent';
      } catch (err) {
        showToast(err.message || 'Failed to resend verification link', 'error');
        resendBtn.disabled = false;
        resendBtn.textContent = 'Resend confirmation link';
      }
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const emailInput = document.getElementById('email');
      const passwordInput = document.getElementById('password');
      const email = emailInput.value.trim();
      const password = passwordInput.value;
      const activePortal = document.querySelector('.role-pill.active')?.dataset.portal || 'student';

      // Inline validation
      const emailError = document.getElementById('email-error');
      const passwordError = document.getElementById('password-error');
      emailError.style.display = 'none';
      passwordError.style.display = 'none';
      resendContainer.style.display = 'none';

      let hasError = false;
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!email || !emailRegex.test(email)) {
        emailError.textContent = 'Please enter a valid email address.';
        emailError.style.display = 'block';
        hasError = true;
      }

      if (!password) {
        passwordError.textContent = 'Please enter your password.';
        passwordError.style.display = 'block';
        hasError = true;
      }

      if (hasError) return;

      submitBtn.disabled = true;
      submitBtn.textContent = 'Signing In...';

      try {
        const { profile } = await signInUser(email, password, activePortal);
        showToast(`Sign in successful! Welcome ${profile.full_name || ''}`, 'success', 2000);

        setTimeout(() => {
          if (redirectTarget) {
            window.location.href = redirectTarget;
          } else if (profile?.role === 'admin') {
            window.location.href = '/admin/dashboard.html';
          } else if (profile?.role === 'accountant') {
            window.location.href = '/accountant/dashboard.html';
          } else if (profile?.role === 'shop_owner') {
            window.location.href = '/owner/dashboard.html';
          } else if (profile?.role === 'staff') {
            window.location.href = '/staff/dashboard.html';
          } else {
            window.location.href = '/student/dashboard.html';
          }
        }, 800);
      } catch (err) {
        const errMsg = err.message || 'Login failed';
        showToast(errMsg, 'error', 5000);
        
        if (errMsg.toLowerCase().includes('not confirmed') || errMsg.toLowerCase().includes('verification')) {
          resendContainer.style.display = 'block';
        }
        
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign In';
      }
    });
  </script>
</body>
</html>
